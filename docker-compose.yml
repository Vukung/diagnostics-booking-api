services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/eve_healthcare
      JWT_SECRET: change-this-in-production
      WEBHOOK_SECRET: change-this-webhook-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy